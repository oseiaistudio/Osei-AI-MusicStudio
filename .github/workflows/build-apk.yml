name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print ($1=="1"?$2:$1)}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "Checking for debug keystore..."
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Existing debug.keystore detected."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to verify debug.keystore creation."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build Debug APK
        run: |
          echo "Building debug APK with Gradle 9.3.1..."
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at: $APK_PATH"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -ls
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Found APK at $APK_PATH but it is empty (0 bytes)."
            exit 1
          fi
          echo "APK successfully verified:"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_RELEASE_DIR/app-debug.apk"
          if [ ! -f "$TEMP_RELEASE_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to stage app-debug.apk in temporary release directory."
            exit 1
          fi
          echo "asset_path=$TEMP_RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Staged release asset at: $TEMP_RELEASE_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version
          
          ASSET_FILE="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ] || [ ! -s "$ASSET_FILE" ]; then
            echo "ERROR: Release asset $ASSET_FILE is missing or empty."
            exit 1
          fi
          
          BASE_NAME=$(basename "$ASSET_FILE")
          if [ "$BASE_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename must be exactly app-debug.apk. Found: $BASE_NAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          echo "Creating GitHub Release: $RELEASE_TAG ($RELEASE_TITLE)..."
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "### Osei AI Music Studio - Debug APK Build
- **Built by:** GitHub Actions
- **Run Number:** #${{ github.run_number }}
- **Run Attempt:** #${{ github.run_attempt }}
- **Source Commit:** \`${{ github.sha }}\`
- **Notice:** This is an automatically generated debug APK for testing. It is signed only with a temporary debug keystore and is not a Play Store production release." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Release Summary ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release created successfully:"
            gh release view "$RELEASE_TAG"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: $RELEASE_TAG"
            echo "Direct Download URL: $DIRECT_URL"
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct APK Link: [$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "The Actions artifact \`app-debug-apk\` is also available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation step did not succeed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions backup artifact 'app-debug-apk' was preserved."
              echo "### BUILD ARTIFACT AVAILABLE" >> "$GITHUB_STEP_SUMMARY"
              echo "The debug APK artifact \`app-debug-apk\` was successfully built and uploaded." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "APK build failed."
            fi
          fi
